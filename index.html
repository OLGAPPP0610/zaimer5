<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), fmt=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
let amount=0,date=null,step='amount',ctx=null,processingTimer=null,noticeTimer=null,doneTimer=null;
const today=new Date(); today.setHours(12,0,0,0);
const plus=n=>{let d=new Date(today);d.setDate(d.getDate()+n);return d};
const dateFmt=d=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(d);
const same=(a,b)=>a&&b&&a.toDateString()===b.toDateString();
const cues = {
 tap: [[460, 0, .055, .032]],
 confirm: [[495, 0, .08, .045], [660, .085, .12, .045]],
 processing: [[260, 0, .075, .024], [310, .14, .085, .026]],
 credit: [[659, 0, .15, .073], [988, .16, .34, .067], [1245, .17, .31, .022]]
};
async function sound(cue = 'tap') {
 try {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state !== 'running') await ctx.resume();
  const now = ctx.currentTime;
  for (const [pitch, delay, duration, volume] of cues[cue]) {
   const osc = ctx.createOscillator(), gain = ctx.createGain();
   const start = now + delay;
   osc.type = cue === 'credit' ? 'sine' : 'triangle';
   osc.frequency.value = pitch;
   gain.gain.setValueAtTime(.0001, start);
   gain.gain.linearRampToValueAtTime(volume, start + .009);
   gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
   osc.connect(gain); gain.connect(ctx.destination);
   osc.onended = () => { osc.disconnect(); gain.disconnect(); };
   osc.start(start); osc.stop(start + duration);
  }
 } catch { /* Audio can be unavailable in an embedded player. */ }
}
function setAmount(n,manual=true){if(manual){app.classList.add('has-input');sound();$('#pointer').style.display='none'}const exceeded=n>30000;amount=Math.min(30000,Math.max(0,n));$('#amountDisplay').classList.toggle('empty',!amount);$('#amountDisplay').innerHTML=(amount?new Intl.NumberFormat('ru-RU').format(amount):'_____')+' <span class="currency">₽</span>';$('#error').textContent=exceeded?'Максимум 30 000 ₽':'';$('#nextAmount').disabled=!amount;document.querySelectorAll('[data-quick]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.quick)===amount));}
function show(which){step=which;$('#app').dataset.step=which;document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===({amount:'amountPanel',calendar:'calendarPanel',processing:'processingPanel',result:'resultPanel'}[which])));$('#pointer').style.display='none'}
function drawCalendar(){const el=$('#calendar');el.innerHTML='';const monthRange=dateFmt(today)+' — '+dateFmt(plus(30));$('#monthTitle').textContent=monthRange;
// Exactly 30 selectable days, laid out as a seven-column grid beginning from today.
for(let pad=0;pad<(today.getDay()+6)%7;pad++){const blank=document.createElement('span');blank.className='day muted';el.append(blank)}for(let i=0;i<=30;i++){const d=plus(i);const b=document.createElement('button');b.type='button';b.disabled=i===0;b.className='day'+(i===0?' today':'')+(same(d,date)?' selected':'');b.textContent=d.getDate();b.title=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(d);b.setAttribute('aria-label',b.title);if(d.getDate()===1&&i!==0)b.classList.add('new-month');b.addEventListener('click',()=>selectDate(d));el.append(b)}
$('#summary').textContent=date?'Вернуть '+fmt(amount)+' до '+dateFmt(date):'Выбери дату возврата';$('#promo').hidden=!date;}

function selectDate(d,manual=true){
 if(step!=='calendar')return;

 if(manual)sound();date=d;drawCalendar();
 $('#confirmDate').disabled=false;
}
function gotoCalendar(){
 if(step!=='amount'||!amount)return;
 
 date=null;show('calendar');drawCalendar();

}
function startProcessing(){
 if(step!=='calendar'||!date)return;
 show('processing');
 setTimeout(()=>sound('processing'),260);
 processingTimer=setTimeout(()=>{
  $('.card-slot').classList.add('credited');$('#notifyText').textContent='Вам зачислено '+fmt(amount);
  $('#notification').classList.add('visible');
  sound('credit');
  doneTimer=setTimeout(()=>{
   $('#notification').classList.remove('visible');
   $('#finalAmount').textContent=fmt(amount);
   $('#finalDate').textContent='до '+dateFmt(date);
   show('result');
  },2740);
 },850);
}
function fit(){document.documentElement.style.setProperty('--fit',Math.min(innerWidth/390,innerHeight/720));}
function resize(){fit();}
window.addEventListener('resize',resize);fit();
